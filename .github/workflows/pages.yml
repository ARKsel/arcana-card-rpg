name: Deploy ARCANA to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [heroine-attacks-v1.png, card-art-repaired.zip, card-art-fix.js, ARCANA-source.zip, index.html, pixel-stage.js, pixel-stage.css, heroine-reference-v1.png, heroine-weapons-v2.png, heroine-walk-v2.png, character-art-v1.png, '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete game
        run: |
          unzip -q ARCANA-source.zip -d site
          unzip -q -o card-art-repaired.zip -d site/dist
          cp heroine-attacks-v1.png card-art-fix.js index.html pixel-stage.js pixel-stage.css heroine-reference-v1.png character-art-v1.png heroine-weapons-v2.png heroine-walk-v2.png site/dist/
          test -f site/dist/index.html
          test -d site/dist/assets/card-art-v2
          test "$(find site/dist/assets/card-art-v2 -name '*.jpg' | wc -l)" -eq 1692
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
        id: deployment
