name: Deploy ARCANA to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [status-marks.js, status-marks.css, support-poses-v4.zip, adventure.js, adventure.css, combat-art-v3.zip, 'resource-card-art/**', game.js, weapon-motion-v2.zip, heroine-attacks-v1.png, card-art-repaired.zip, card-art-fix.js, ARCANA-source.zip, index.html, pixel-stage.js, pixel-stage.css, heroine-reference-v1.png, heroine-weapons-v2.png, heroine-walk-v2.png, character-art-v1.png, '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete game
        run: |
          unzip -q ARCANA-source.zip -d site
          unzip -q -o card-art-repaired.zip -d site/dist
          unzip -q -o weapon-motion-v2.zip -d site/dist
          unzip -q -o combat-art-v3.zip -d site/dist
          test "$(find site/dist/assets/combat-art-v3 -name '*.png' | wc -l)" -eq 62
          unzip -q -o support-poses-v4.zip -d site/dist
          test "$(find site/dist/assets/combat-art-v3/support-poses-v4 -name '*.png' | wc -l)" -eq 24
          cp status-marks.js status-marks.css adventure.js adventure.css game.js heroine-attacks-v1.png card-art-fix.js index.html pixel-stage.js pixel-stage.css heroine-reference-v1.png character-art-v1.png heroine-weapons-v2.png heroine-walk-v2.png site/dist/
          mkdir -p site/dist/assets/resource-card-art
          cp resource-card-art/*.png site/dist/assets/resource-card-art/
          test "$(find site/dist/assets/resource-card-art -name '*.png' | wc -l)" -eq 14
          test -f site/dist/index.html
          test -d site/dist/assets/card-art-v2
          test "$(find site/dist/assets/card-art-v2 -name '*.jpg' | wc -l)" -eq 1692
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
        id: deployment
