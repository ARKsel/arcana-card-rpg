name: Deploy ARCANA to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ARCANA-source.zip, '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete game
        run: |
          unzip -q ARCANA-source.zip -d site
          test -f site/dist/index.html
          test -d site/dist/assets/card-art
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
        id: deployment
